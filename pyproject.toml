[project]
name = "google-jules-mcp"
version = "0.1.0"
description = "MCP Server for Google Jules AI Coding Agent"
authors = [
    { name = "Antigravity", email = "antigravity@labdoctorm.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "aiohttp>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[project.scripts]
google-jules-mcp = "src.server:main"

