[project]
name = "google-jules-mcp"
version = "0.1.0"
description = "MCP Server for Google Jules AI Coding Agent"
authors = [
    { name = "Antigravity", email = "antigravity@labdoctorm.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "aiohttp>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "flake8>=7.0",
    "black>=24.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[project.scripts]
google-jules-mcp = "src.server:main"
