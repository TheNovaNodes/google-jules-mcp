[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "google-jules-mcp"
version = "0.1.0"
description = "MCP Server for Google Jules AI Coding Agent"
authors = [
    { name = "Antigravity", email = "antigravity@labdoctorm.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "aiohttp>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
google-jules-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["src"]
